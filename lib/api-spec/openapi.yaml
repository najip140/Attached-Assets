openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Pharmacy Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: dashboard
    description: Dashboard summary
  - name: products
    description: Product management
  - name: suppliers
    description: Supplier management
  - name: sales
    description: Sales / POS
  - name: inventory
    description: Inventory / stock movements
  - name: reports
    description: Reports
  - name: documents
    description: Document management
  - name: endofday
    description: End of day closing
  - name: inventoryloss
    description: Inventory loss management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  # Dashboard
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Summary data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # Users
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"

  # Suppliers
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List all suppliers
      responses:
        "200":
          description: List of suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Create a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"

  /suppliers/{id}:
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update a supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
    delete:
      operationId: deleteSupplier
      tags: [suppliers]
      summary: Delete a supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"

  # Products
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List/search products
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: lowStock
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"

  /products/expiry:
    get:
      operationId: getExpiringProducts
      tags: [products]
      summary: Get expired and expiring products
      parameters:
        - name: days
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Expiring products grouped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpiryReport"

  # Sales
  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List sales
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: userId
          in: query
          schema:
            type: integer
        - name: paymentType
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
    post:
      operationId: createSale
      tags: [sales]
      summary: Create a sale (POS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Created sale with receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"

  /sales/{id}:
    get:
      operationId: getSale
      tags: [sales]
      summary: Get a sale with items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sale with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"

  # Inventory / Stock Movements
  /stock-movements:
    get:
      operationId: listStockMovements
      tags: [inventory]
      summary: List stock movements
      parameters:
        - name: productId
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of stock movements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockMovement"
    post:
      operationId: createStockMovement
      tags: [inventory]
      summary: Record a stock in/out movement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockMovementInput"
      responses:
        "201":
          description: Created movement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovement"

  # Reports
  /reports/daily:
    get:
      operationId: getDailyReport
      tags: [reports]
      summary: Get daily sales report
      parameters:
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Daily report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReport"

  /reports/monthly:
    get:
      operationId: getMonthlyReport
      tags: [reports]
      summary: Get monthly sales report
      parameters:
        - name: year
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Monthly report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReport"

  /reports/sales:
    get:
      operationId: getSalesReport
      tags: [reports]
      summary: Get detailed sales report with filters
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: userId
          in: query
          schema:
            type: integer
        - name: paymentType
          in: query
          schema:
            type: string
        - name: productId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Sales report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesReport"

  /reports/inventory:
    get:
      operationId: getInventoryReport
      tags: [reports]
      summary: Get inventory valuation report
      responses:
        "200":
          description: Inventory report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryReport"

  /reports/users:
    get:
      operationId: getUserPerformanceReport
      tags: [reports]
      summary: Get user performance report
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: User performance report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserPerformance"

  /reports/profit:
    get:
      operationId: getProfitReport
      tags: [reports]
      summary: Get profit report
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Profit report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfitReport"

  /reports/losses:
    get:
      operationId: getLossReport
      tags: [reports]
      summary: Get inventory loss report (returns, damaged, lost)
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Loss report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryLoss"

  # Documents
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get document metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    patch:
      operationId: updateDocument
      tags: [documents]
      summary: Update document metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdate"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"

  # End of Day
  /end-of-day:
    get:
      operationId: listEndOfDay
      tags: [endofday]
      summary: List end of day records
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of EOD records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EndOfDay"
    post:
      operationId: closeDay
      tags: [endofday]
      summary: Close the day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseDayInput"
      responses:
        "201":
          description: Day closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndOfDay"

  /end-of-day/preview:
    get:
      operationId: getEndOfDayPreview
      tags: [endofday]
      summary: Preview end of day summary for a date
      parameters:
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: EOD preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndOfDayPreview"

  # Inventory Loss
  /inventory-loss:
    get:
      operationId: listInventoryLoss
      tags: [inventoryloss]
      summary: List inventory loss records
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of inventory loss records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryLoss"
    post:
      operationId: createInventoryLoss
      tags: [inventoryloss]
      summary: Record an inventory loss
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryLossInput"
      responses:
        "201":
          description: Created inventory loss record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryLoss"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    MessageResult:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # Auth
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResult:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    # User
    User:
      type: object
      required: [id, username, name, role, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        email:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, pharmacist, cashier]
        createdAt:
          type: string

    UserInput:
      type: object
      required: [username, name, role, password]
      properties:
        username:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, pharmacist, cashier]
        password:
          type: string

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, pharmacist, cashier]
        password:
          type: string

    # Supplier
    Supplier:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        contact:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        createdAt:
          type: string

    SupplierInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        contact:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string

    SupplierUpdate:
      type: object
      properties:
        name:
          type: string
        contact:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string

    # Product
    Product:
      type: object
      required: [id, name, genericName, category, quantity, reorderLevel, purchasePrice, sellingPrice, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        genericName:
          type: string
        category:
          type: string
        barcode:
          type: ["string", "null"]
        batchNumber:
          type: ["string", "null"]
        supplierId:
          type: ["integer", "null"]
        supplierName:
          type: ["string", "null"]
        purchasePrice:
          type: number
        sellingPrice:
          type: number
        quantity:
          type: integer
        reorderLevel:
          type: integer
        expiryDate:
          type: ["string", "null"]
        createdAt:
          type: string

    ProductInput:
      type: object
      required: [name, genericName, category, purchasePrice, sellingPrice, quantity, reorderLevel]
      properties:
        name:
          type: string
        genericName:
          type: string
        category:
          type: string
        barcode:
          type: string
        batchNumber:
          type: string
        supplierId:
          type: integer
        purchasePrice:
          type: number
        sellingPrice:
          type: number
        quantity:
          type: integer
        reorderLevel:
          type: integer
        expiryDate:
          type: string

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
        genericName:
          type: string
        category:
          type: string
        barcode:
          type: string
        batchNumber:
          type: string
        supplierId:
          type: integer
        purchasePrice:
          type: number
        sellingPrice:
          type: number
        quantity:
          type: integer
        reorderLevel:
          type: integer
        expiryDate:
          type: string

    ExpiryReport:
      type: object
      required: [expired, expiringSoon]
      properties:
        expired:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        expiringSoon:
          type: array
          items:
            $ref: "#/components/schemas/Product"

    # Sale
    SaleItemInput:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId:
          type: integer
        quantity:
          type: integer
        unitPrice:
          type: number

    SaleItem:
      type: object
      required: [id, saleId, productId, quantity, unitPrice, subtotal]
      properties:
        id:
          type: integer
        saleId:
          type: integer
        productId:
          type: integer
        productName:
          type: ["string", "null"]
        quantity:
          type: integer
        unitPrice:
          type: number
        subtotal:
          type: number

    Sale:
      type: object
      required: [id, totalAmount, discount, amountPaid, change, paymentType, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: ["integer", "null"]
        cashierName:
          type: ["string", "null"]
        totalAmount:
          type: number
        discount:
          type: number
        amountPaid:
          type: number
        change:
          type: number
        paymentType:
          type: string
          enum: [cash, wallet, bank]
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleItem"
        createdAt:
          type: string

    SaleInput:
      type: object
      required: [items, totalAmount, discount, amountPaid, change, paymentType]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleItemInput"
        totalAmount:
          type: number
        discount:
          type: number
        amountPaid:
          type: number
        change:
          type: number
        paymentType:
          type: string
          enum: [cash, wallet, bank]

    # Inventory
    StockMovement:
      type: object
      required: [id, productId, type, quantity, createdAt]
      properties:
        id:
          type: integer
        productId:
          type: integer
        productName:
          type: ["string", "null"]
        type:
          type: string
          enum: [in, out, adjustment]
        quantity:
          type: integer
        reason:
          type: ["string", "null"]
        userId:
          type: ["integer", "null"]
        userName:
          type: ["string", "null"]
        createdAt:
          type: string

    StockMovementInput:
      type: object
      required: [productId, type, quantity]
      properties:
        productId:
          type: integer
        type:
          type: string
          enum: [in, out, adjustment]
        quantity:
          type: integer
        reason:
          type: string

    # Dashboard
    DashboardSummary:
      type: object
      required: [totalSalesToday, totalProducts, lowStockCount, expiringCount, recentSales, salesChartData]
      properties:
        totalSalesToday:
          type: number
        totalSalesThisMonth:
          type: number
        totalProducts:
          type: integer
        lowStockCount:
          type: integer
        expiringCount:
          type: integer
        totalProfit:
          type: number
        recentSales:
          type: array
          items:
            $ref: "#/components/schemas/Sale"
        lowStockProducts:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        salesChartData:
          type: array
          items:
            $ref: "#/components/schemas/SalesChartPoint"

    SalesChartPoint:
      type: object
      required: [date, total]
      properties:
        date:
          type: string
        total:
          type: number

    # Reports
    DailyReport:
      type: object
      required: [date, totalSales, totalRevenue, totalProfit, totalTransactions, salesByCategory]
      properties:
        date:
          type: string
        totalSales:
          type: integer
        totalRevenue:
          type: number
        totalProfit:
          type: number
        totalTransactions:
          type: integer
        salesByCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategorySales"
        topProducts:
          type: array
          items:
            $ref: "#/components/schemas/ProductSales"

    MonthlyReport:
      type: object
      required: [year, month, totalRevenue, totalProfit, totalTransactions, dailyBreakdown]
      properties:
        year:
          type: integer
        month:
          type: integer
        totalRevenue:
          type: number
        totalProfit:
          type: number
        totalTransactions:
          type: integer
        dailyBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/DailySummary"
        topProducts:
          type: array
          items:
            $ref: "#/components/schemas/ProductSales"

    SalesReport:
      type: object
      required: [totalTransactions, totalRevenue, totalDiscount, totalProfit, salesByPaymentType, sales]
      properties:
        totalTransactions:
          type: integer
        totalRevenue:
          type: number
        totalDiscount:
          type: number
        totalProfit:
          type: number
        salesByPaymentType:
          type: array
          items:
            $ref: "#/components/schemas/PaymentTypeSummary"
        sales:
          type: array
          items:
            $ref: "#/components/schemas/Sale"

    PaymentTypeSummary:
      type: object
      required: [paymentType, count, total]
      properties:
        paymentType:
          type: string
        count:
          type: integer
        total:
          type: number

    InventoryReport:
      type: object
      required: [totalProducts, totalStockValue, totalRetailValue, lowStockCount, items]
      properties:
        totalProducts:
          type: integer
        totalStockValue:
          type: number
        totalRetailValue:
          type: number
        lowStockCount:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"

    InventoryItem:
      type: object
      required: [productId, productName, category, quantity, reorderLevel, purchasePrice, sellingPrice, stockValue, retailValue]
      properties:
        productId:
          type: integer
        productName:
          type: string
        category:
          type: string
        quantity:
          type: integer
        reorderLevel:
          type: integer
        purchasePrice:
          type: number
        sellingPrice:
          type: number
        stockValue:
          type: number
        retailValue:
          type: number

    UserPerformance:
      type: object
      required: [userId, userName, totalSales, totalRevenue, totalTransactions]
      properties:
        userId:
          type: integer
        userName:
          type: string
        totalSales:
          type: number
        totalRevenue:
          type: number
        totalTransactions:
          type: integer

    ProfitReport:
      type: object
      required: [totalRevenue, totalCost, totalProfit, profitMargin, byProduct]
      properties:
        totalRevenue:
          type: number
        totalCost:
          type: number
        totalProfit:
          type: number
        profitMargin:
          type: number
        byProduct:
          type: array
          items:
            $ref: "#/components/schemas/ProductProfit"

    ProductProfit:
      type: object
      required: [productId, productName, quantitySold, revenue, cost, profit]
      properties:
        productId:
          type: integer
        productName:
          type: string
        quantitySold:
          type: integer
        revenue:
          type: number
        cost:
          type: number
        profit:
          type: number

    CategorySales:
      type: object
      required: [category, revenue, count]
      properties:
        category:
          type: string
        revenue:
          type: number
        count:
          type: integer

    ProductSales:
      type: object
      required: [productId, productName, quantity, revenue]
      properties:
        productId:
          type: integer
        productName:
          type: string
        quantity:
          type: integer
        revenue:
          type: number

    DailySummary:
      type: object
      required: [date, revenue, transactions]
      properties:
        date:
          type: string
        revenue:
          type: number
        transactions:
          type: integer

    # Documents
    Document:
      type: object
      required: [id, title, category, fileName, filePath, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        category:
          type: string
        description:
          type: ["string", "null"]
        fileName:
          type: string
        filePath:
          type: string
        fileSize:
          type: ["integer", "null"]
        mimeType:
          type: ["string", "null"]
        createdBy:
          type: ["integer", "null"]
        createdByName:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    DocumentUpdate:
      type: object
      properties:
        title:
          type: string
        category:
          type: string
        description:
          type: string

    # End of Day
    EndOfDay:
      type: object
      required: [id, date, totalCashSales, totalWalletSales, totalBankSales, totalRevenue, totalProfit, totalTransactions, closedAt]
      properties:
        id:
          type: integer
        date:
          type: string
        totalCashSales:
          type: number
        totalWalletSales:
          type: number
        totalBankSales:
          type: number
        totalRevenue:
          type: number
        totalProfit:
          type: number
        totalTransactions:
          type: integer
        notes:
          type: ["string", "null"]
        closedBy:
          type: ["integer", "null"]
        closedByName:
          type: ["string", "null"]
        closedAt:
          type: string
        createdAt:
          type: string

    EndOfDayPreview:
      type: object
      required: [date, totalCashSales, totalWalletSales, totalBankSales, totalRevenue, totalProfit, totalTransactions, alreadyClosed]
      properties:
        date:
          type: string
        totalCashSales:
          type: number
        totalWalletSales:
          type: number
        totalBankSales:
          type: number
        totalRevenue:
          type: number
        totalProfit:
          type: number
        totalTransactions:
          type: integer
        alreadyClosed:
          type: boolean

    CloseDayInput:
      type: object
      required: [date]
      properties:
        date:
          type: string
        notes:
          type: string

    # Inventory Loss
    InventoryLoss:
      type: object
      required: [id, type, productId, quantity, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [return, damaged, lost]
        productId:
          type: integer
        productName:
          type: ["string", "null"]
        quantity:
          type: integer
        reason:
          type: ["string", "null"]
        userId:
          type: ["integer", "null"]
        userName:
          type: ["string", "null"]
        createdAt:
          type: string

    InventoryLossInput:
      type: object
      required: [type, productId, quantity]
      properties:
        type:
          type: string
          enum: [return, damaged, lost]
        productId:
          type: integer
        quantity:
          type: integer
        reason:
          type: string
